[project]
name = "invoice-extraction"
version = "0.1.0"
description = "Structured JSON extraction from invoices and receipts using a fine-tuned VLM"
requires-python = ">=3.10"
dependencies = [
    "transformers>=4.57.0",
    "datasets",
    "accelerate",
    "peft",
    "bitsandbytes",
    "pillow",
    "pyyaml",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "jinja2",
    "faker",
    "weasyprint",
    "albumentations",
    "pymupdf",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "ipykernel", "matplotlib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_extraction"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Chosen explicitly rather than relying on the default set, so that upgrading
# ruff cannot silently change what counts as a lint failure.
# pycodestyle, pyflakes, import sorting, pyupgrade, bugbear, simplify.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
