model_id: Qwen/Qwen2-VL-2B-Instruct
max_pixels: 401408  # ~512 image tokens; 1003520 was ~2.5x slower with no accuracy need for it on receipts
min_pixels: 3136

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

learning_rate: 0.0002
num_train_epochs: 1  # first run to prove the pipeline works end to end; raise once this succeeds
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
gradient_checkpointing: true
optim: paged_adamw_8bit
warmup_ratio: 0.03
logging_steps: 10
save_strategy: epoch
output_dir: checkpoints/qwen2vl-2b-lora
